<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Sua Loja de Tecnologia</title>
    <style>
        /* ESTILOS GERAIS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* CABEÇALHO */
        header {
            background-color: #1e293b;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .cart-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .cart-btn:hover {
            background-color: #0369a1;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 2rem;
        }

        /* GRID DE PRODUTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 150px;
            background-color: #e2e8f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.2rem;
            color: #059669;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .add-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .add-btn:hover {
            background-color: #059669;
        }

        /* PAINEL DO CARRINHO */
        .cart-panel {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .cart-panel h2 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }

        .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            margin-left: 5px;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
        }

        .checkout-btn:hover {
            background-color: #2563eb;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TechStore</div>
        <button class="cart-btn">🛒 Carrinho (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <!-- Vitrine de Produtos -->
        <main>
            <div class="products-grid" id="products-container"></div>
        </main>

        <!-- Lateral do Carrinho -->
        <aside class="cart-panel">
            <h2>Seu Carrinho</h2>
            <ul class="cart-items" id="cart-items">
                <li style="color: #64748b;">O carrinho está vazio.</li>
            </ul>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">R$ 0,00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Finalizar Compra</button>
        </aside>
    </div>

    <script>
        // Dados dos produtos de amostra
        const products = [
            { id: 1, name: "Mouse Gamer RGB", price: 120.00 },
            { id: 2, name: "Teclado Mecânico", price: 350.00 },
            { id: 3, name: "Headset Surround 7.1", price: 280.00 },
            { id: 4, name: "Monitor 24' 144Hz", price: 890.00 },
            { id: 5, name: "Webcam Full HD", price: 199.00 },
            { id: 6, name: "Mousepad Extra Grande", price: 60.00 }
        ];

        let cart = [];

        // Renderizar produtos na tela
        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">${product.name}</div>
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                    <button class="add-btn" onclick="addToCart(${product.id})">Adicionar ao Carrinho</button>
                `;
                container.appendChild(card);
            });
        }

        // Adicionar ao carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCart();
        }

        // Remover do carrinho
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // Atualizar visualização do carrinho
        function updateCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartCount.innerText = cart.length;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<li style="color: #64748b;">O carrinho está vazio.</li>';
                cartTotal.innerText = 'R$ 0,00';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <span>${item.name} - R$ ${item.price.toFixed(2).replace('.', ',')}</span>
                    <button class="remove-btn" onclick="removeFromCart(${index})">X</button>
                `;
                cartItemsContainer.appendChild(li);
            });

            cartTotal.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        // Finalizar Compra
        function checkout() {
            if (cart.length === 0) {
                alert('Seu carrinho está vazio!');
            } else {
                alert('Obrigado pela compra! Pedido simulado com sucesso.');
                cart = [];
                updateCart();
            }
        }

        // Inicializar
        renderProducts();
    </script>
</body>
</html>
